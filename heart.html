<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#060208;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    display:block;
    width:min(100vmin,800px);
    height:min(100vmin,800px);
}
</style>
</head>

<body>
<canvas id="loveCanvas" width="800" height="800"></canvas>

<script>
"use strict";

const SC=21;
const OY=20;
const DURATION=25;
const TICK=16;
const ANIM=42;
const LIFT=34;
const GAP=7;
const SIZES=[9,10,11,12];
const FONT="Arial";
const BG="#060208";

const canvas=document.getElementById("loveCanvas");
const ctx=canvas.getContext("2d");

const rng=(()=>{
    let seed=11;

    return {
        random(){
            seed=(seed*1664525+1013904223)>>>0;
            return seed/4294967296;
        },
        uniform(a,b){
            return a+this.random()*(b-a);
        },
        choice(arr){
            return arr[Math.floor(this.random()*arr.length)];
        },
        shuffle(arr){
            for(let i=arr.length-1;i>0;i--){
                const j=Math.floor(this.random()*(i+1));
                [arr[i],arr[j]]=[arr[j],arr[i]];
            }
            return arr;
        }
    };
})();

const PHRASES=[
    "I love you","Seni seviyorum","Te amo","Je t'aime",
    "Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю",
    "사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ",
    "Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię",
    "ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тобі кохаю"
];

const FLASH=[1.0,0.78,0.78];

const BGC=[
    parseInt(BG.slice(1,3),16)/255,
    parseInt(BG.slice(3,5),16)/255,
    parseInt(BG.slice(5,7),16)/255
];

const mainIds=[];
const active=[];

function clamp(v){
    return Math.max(0,Math.min(1,v));
}

function mix(a,b,k){
    return a.map((v,i)=>v+(b[i]-v)*k);
}

function dim(c,k){
    return c.map(v=>v*k);
}

function hx(c){
    return "#"+c.map(v=>
        Math.round(clamp(v)*255).toString(16).padStart(2,"0")
    ).join("");
}

function fontFor(size){
    return `bold ${size}px ${FONT}`;
}

function heart(a){
    const x=16*Math.pow(Math.sin(a),3);
    const y=13*Math.cos(a)
        -5*Math.cos(2*a)
        -2*Math.cos(3*a)
        -Math.cos(4*a);

    return [x*SC,y*SC+OY];
}

const POLY=Array.from({length:720},(_,i)=>
    heart(2*Math.PI*i/720)
);

const EDGES=POLY.map((p,i)=>[
    p,POLY[(i+1)%POLY.length]
]);

const YMAX=Math.max(...POLY.map(p=>p[1]));
const YMIN=Math.min(...POLY.map(p=>p[1]));
const CY=(YMAX+YMIN)/2;

function spans(y){
    const xs=[];

    for(const [[x1,y1],[x2,y2]] of EDGES){
        if((y1<=y&&y<y2)||(y2<=y&&y<y1)){
            xs.push(x1+(y-y1)*(x2-x1)/(y2-y1));
        }
    }

    xs.sort((a,b)=>a-b);

    const result=[];

    for(let i=0;i<xs.length;i+=2){
        if(xs[i+1]!==undefined){
            result.push([xs[i],xs[i+1]]);
        }
    }

    return result;
}

function intersect(A,B){
    const out=[];

    for(const a of A){
        for(const b of B){
            const lo=Math.max(a[0],b[0]);
            const hi=Math.min(a[1],b[1]);

            if(hi-lo>14){
                out.push([lo,hi]);
            }
        }
    }

    return out;
}

function* phraseCycle(){
    while(true){
        const order=rng.shuffle([...PHRASES]);
        yield* order;
    }
}

function mathDist(x,y){
    return Math.hypot(
        x/(16*SC),
        (y-CY)/(14.5*SC)
    );
}

function build(){
    const cycle=phraseCycle();

    const rowH=Math.max(...SIZES.map(size=>size+3))+4;
    const half=rowH/2;
    const placed=[];

    for(let y=YMAX-half;y>YMIN+half;y-=rowH){
        const row=intersect(spans(y+half),spans(y-half));

        for(let [lo,hi] of row){
            lo+=4;
            hi-=4;

            let cur=lo+rng.uniform(0,8);
            const line=[];

            while(true){
                let fit=null;

                for(let tries=0;tries<10;tries++){
                    const text=cycle.next().value;
                    const size=rng.choice(SIZES);

                    ctx.font=fontFor(size);
                    const w=ctx.measureText(text).width;

                    if(cur+w<=hi){
                        fit={text,size,w};
                        break;
                    }
                }

                if(!fit)break;

                line.push({
                    x:cur+fit.w/2,
                    text:fit.text,
                    size:fit.size,
                    w:fit.w
                });

                cur+=fit.w+GAP;
            }

            if(!line.length)continue;

            if(line.length>1){
                const left=hi-(
                    line[line.length-1].x+
                    line[line.length-1].w/2
                );

                line.forEach((item,i)=>{
                    item.x+=left*i/(line.length-1);
                });
            }else{
                line[0].x=(lo+hi)/2;
            }

            line.forEach((item,i)=>{
                placed.push({
                    x:item.x,
                    y,
                    text:item.text,
                    size:item.size,
                    edge:i===0||i===line.length-1
                });
            });
        }
    }

    const wine=[0.58,0.0,0.09];
    const crimson=[0.90,0.05,0.14];
    const blood=[0.98,0.10,0.16];

    for(const p of placed){
        const rad=Math.min(1,mathDist(p.x,p.y));

        let base=mix(wine,crimson,0.25+0.75*rad);

        base=mix(
            base,
            blood,
            rng.uniform(0,0.35)+(p.edge?0.3:0)
        );

        p.color=base.map(v=>Math.min(1,v));
        p.rad=rad;
    }

    const edges=placed.filter(p=>p.edge);
    const inner=placed.filter(p=>!p.edge);

    edges.sort((a,b)=>
        (Math.atan2(a.x,a.y-CY)+2*Math.PI)%(2*Math.PI)-
        (Math.atan2(b.x,b.y-CY)+2*Math.PI)%(2*Math.PI)
    );

    inner.sort((a,b)=>b.rad-a.rad);

    return [...edges,...inner];
}

function spawn(p){
    p.f=0;
    p.dx=rng.uniform(-10,10);
    p.finished=false;
    p.shimmer=false;
    active.push(p);
    mainIds.push(p);
}

function drawText(p,x,y,color,size=p.size){
    ctx.font=fontFor(size);
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle=color;

    ctx.fillText(
        p.text,
        x+canvas.width/2,
        y+canvas.height/2
    );
}

function mathSin(v){
    return Math.sin(Math.PI*v);
}

function animate(p){
    p.f++;

    const u=clamp(p.f/ANIM);
    const e=1-Math.pow(1-u,3);

    const c=p.color;
    const x=p.x;
    const y=-p.y;

    const hover=(1-e)*LIFT;
    const px=x+p.dx*(1-e);
    const py=y-hover;

    drawText(
        p,px+2,py+3,
        hx(mix(BGC,dim(c,0.30),e))
    );

    drawText(
        p,px,py,
        hx(mix(BGC,dim(c,0.20),e*e)),
        p.size+1
    );

    const flash=0.75*mathSin(clamp((u-0.55)/0.45));

    const col=mix(
        mix(BGC,c,Math.pow(e,1.5)),
        FLASH,
        flash
    );

    drawText(p,px,py,hx(col));

    if(u>=1){
        p.finished=true;
        return false;
    }

    return true;
}

const ORDER=build();
let index=0;
let acc=0;
let spawning=true;

const RATE=ORDER.length/(DURATION*1000/TICK);

function shimmer(){
    if(!mainIds.length)return;

    const p=rng.choice(mainIds);
    p.shimmer=true;

    setTimeout(()=>p.shimmer=false,260);
    setTimeout(shimmer,140);
}

function step(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(spawning){
        acc+=RATE;

        while(acc>=1&&index<ORDER.length){
            acc-=1;
            spawn(ORDER[index++]);
        }

        if(index>=ORDER.length){
            spawning=false;
            shimmer();
        }
    }

    for(let i=active.length-1;i>=0;i--){
        if(!animate(active[i])){
            active.splice(i,1);
        }
    }

    for(const p of mainIds){
        if(p.finished){
            const color=p.shimmer
                ?hx(mix(p.color,FLASH,0.6))
                :hx(p.color);

            drawText(p,p.x,-p.y,color);
        }
    }

    requestAnimationFrame(step);
}

requestAnimationFrame(step);
</script>
</body>
</html>
